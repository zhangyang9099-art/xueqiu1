# ==========================================
# 雪球评论区爬虫系统配置
# ==========================================

# --- Cookie 配置 ---
# 获取方法：
#   1. Chrome 浏览器登录 https://xueqiu.com
#   2. F12 → Application → Cookies → xueqiu.com
#   3. 复制 xq_a_token 的 Value 粘贴到下方
cookie:
  xq_a_token: "cb0038461faa714a89b1243eb0972aeb978da553"
  cookie_file: "data/browser_cookies.json"

# --- 监控股票列表 ---
stocks:
  - symbol: "SH600519"
    name: "贵州茅台"
 # - symbol: "SZ000858"
 #   name: "五粮液"
  # - symbol: "SZ300750"
  #   name: "宁德时代"

# --- 跟踪用户列表 ---
# user_id: 用户雪球主页 URL 中的数字 ID
# 例如 https://xueqiu.com/u/1234567890 → user_id 为 "1234567890"
tracked_users: []
  # - user_id: "1234567890"
  #   screen_name: "某知名大V"
  #   note: "经常发表茅台分析"

# --- 爬取策略 ---
scraping:
  # 每日调度时间（24小时制）
  schedule_hour: 3
  schedule_minute: 0

  # 请求频率控制
  min_request_interval: 2    # 请求最小间隔（秒）
  max_request_interval: 5    # 请求最大间隔（秒）
  max_requests_per_minute: 20  # 每分钟最大请求数
  burst_rest_count: 95         # 每 N 次请求后强制休息
  burst_rest_seconds_min: 90  # 强制休息最少秒数
  burst_rest_seconds_max: 120  # 强制休息最多秒数
  history_min_request_interval_seconds: 7
  history_max_request_interval_seconds: 11
  history_burst_rest_count: 50
  history_burst_rest_seconds_min: 150
  history_burst_rest_seconds_max: 240
  history_adaptive_pacing: false
  history_adaptive_fast_min_request_interval_seconds: 6
  history_adaptive_fast_max_request_interval_seconds: 9
  history_adaptive_slow_min_request_interval_seconds: 8
  history_adaptive_slow_max_request_interval_seconds: 14
  history_adaptive_success_threshold: 20
  history_adaptive_slow_request_count: 20

  # 每只股票最多爬取的帖子页数（防止首次运行过量）
  max_pages_per_stock: 50
  stock_timeline_page_size: 10  # 与官网讨论区分页保持一致
  stock_timeline_source: "user" # 与官网“讨论”tab保持一致
  stock_timeline_sort: "time"
  timeline_request_timeout_ms: 12000  # 历史边界定位/时间线单页请求超时
  timeline_request_retries: 1         # 时间线失败优先走会话回收，不做长时间重复等待
  stock_timeline_transport: "auto"
  history_timeline_transport: "page"
  history_timeline_fallback_transport: "isolated_page"
  history_unexpected_html_retry: 1
  history_cursor_enabled: true
  history_page_timeout_streak_limit: 2
  # 每个帖子最多爬取的评论页数
  max_comment_pages: 200
  comment_variant_page_size: 100 # 评论回填时额外尝试的大页抓取
  comment_request_timeout_ms: 12000  # 单次评论接口请求超时
  comment_request_retries: 1         # 评论接口单页最多重试次数
  comment_post_budget_seconds: 25    # 单个帖子评论抓取预算
  comment_v3_enabled: true           # 优先使用网页展开评论的 v3 接口
  comment_v3_page_size: 20           # v3 主评论页大小，保持与网页一致
  comment_v3_child_max_pages: 30     # 单个“查看N条回复”链最多翻多少批
  comment_backfill_min_request_interval_seconds: 8
  comment_backfill_max_request_interval_seconds: 14
  comment_backfill_burst_rest_count: 50
  comment_backfill_burst_rest_seconds_min: 150
  comment_backfill_burst_rest_seconds_max: 240
  comment_backfill_comment_mode_enabled: false
  comment_backfill_post_budget_seconds: 75
  # 每个用户最多爬取的发言页数
  max_pages_per_user: 50
  history_confirm_runs: 2       # 历史补全连续多少次无进展后才判定触底
  history_chunk_pages: 3        # 历史模式按多少页为一个续跑分段
  # 用户时间线 transport 配置（参照评论回填模式，用于绕过反爬验证）
  user_timeline_transport: "auto"           # 增量模式: auto/page/api/isolated_page
  user_history_timeline_transport: "page"   # 历史模式: 推荐用 page 或 isolated_page
  user_history_timeline_fallback_transport: "isolated_page"  # 失败回退模式
  # 用户评论抓取
  user_fetch_comments_enabled: false      # 用户模式先只跑时间线，评论后置，避免单慢帖拖住主流程
  user_comment_post_budget_seconds: 30    # 单个帖子评论抓取预算（秒）
  user_comment_max_pages: 20              # 单帖评论最大页数
  user_incremental_comment_gap_limit: 60  # 用户每日增量后，最多补扫多少个旧发言评论缺口
  user_sync_min_request_interval_seconds: 8
  user_sync_max_request_interval_seconds: 14
  user_sync_burst_rest_count: 50
  user_sync_burst_rest_seconds_min: 150
  user_sync_burst_rest_seconds_max: 240
  history_chunk_timeout_seconds: 240     # 单个历史分段子进程最长运行秒数
  history_inline_comments: false        # 历史模式先补帖子，评论后置修复
  history_reuse_single_client: true     # 同一批历史任务复用单一已验证会话
  history_browser_recycle_pages: 30     # 历史长跑时每 N 页轻量回收会话页
  history_browser_recycle_requests: 100 # 历史长跑时每 N 次请求轻量回收会话页
  history_comment_repair_batch_posts: 4       # 历史阶段每轮评论修复处理多少帖子
  history_comment_repair_timeout_seconds: 240 # 单轮评论修复最长秒数
  history_comment_repair_max_rounds: 2        # 每只股票最多修复多少轮评论
  single_comment_post_timeout_seconds: 45     # 单个缺口帖子评论修复最长秒数

  # 重试策略
  max_retries: 3
  comment_backfill_days: 7   # 评论回填检查最近N天的帖子
  warm_referer_paths: true   # 首次访问接口前先打开对应页面暖场
  browser_headless: true
  browser_channel: "chrome"
  browser_engine: "playwright"
  browser_locale: "zh-CN"
  browser_timezone: "Asia/Shanghai"
  session_profile_dir: "data/manual_chrome_profile"
  profile_bootstrap_mode: "if_missing"
  session_probe_required: true
  manual_verification_enabled: true
  manual_verification_timeout_seconds: 300
  manual_verification_mode: "external"
  manual_verification_gate_enabled: false
  manual_verification_cooldown_minutes: 30
  manual_verification_max_failures_per_run: 2
  manual_verification_poll_seconds: 2
  manual_verification_grace_seconds: 45
  manual_verification_failure_stable_seconds: 12
  manual_verification_refresh_cooldown_seconds: 45
  manual_verification_auto_refresh: false
  manual_verification_success_checks: 2
  manual_verification_prewarm_pages: 2
  manual_verification_resume_probe_count: 2
  manual_verification_cleanup_profile_processes: true
  manual_verification_profile_dir: "data/manual_chrome_profile"

# --- 数据库 ---
database:
  type: "sqlite"
  sqlite_path: "data/xueqiu.db"

# --- 通知配置（可选） ---
notification:
  enabled: false
  type: "email"
  email:
    smtp_server: "smtp.qq.com"
    smtp_port: 465
    sender: ""
    password: ""
    receiver: ""

# --- 日志 ---
logging:
  level: "INFO"
  file: "data/logs/scraper.log"
  max_size_mb: 10
  backup_count: 5
